# DRAFT by requirements-analyst, adapted from profiles/elt-cloud-warehouse.yaml (architect finalises).
project: ecommerce-daily-orders
paradigm: auto            # auto | ELT | ETL | ETLT (architect decides in ADR-001)
processing: batch         # daily batch, stated by the human
target:
  type: embedded_warehouse   # local DuckDB, no cloud
  engine: duckdb
  elastic_compute: false
sources:
  - {name: customers_csv, kind: file}
  - {name: orders_csv, kind: file}
  - {name: payments_csv, kind: file}
sensitivity:
  pii: true               # customer_name, email in customers.csv
  mask_before_landing: false   # no such requirement given; see requirements.md PII section
transforms:
  style: sql              # DuckDB SQL; placeholder until the architect decides
team:
  sql_strength: medium    # placeholder, not given by the human (open question 6)
requirements:
  keep_raw: true          # defects must stay reproducible
  schema_change_frequency: low   # static scenario CSVs
  storage_constrained: false
slas:
  freshness_hours: 24     # placeholder derived from "daily" (open question 1)
